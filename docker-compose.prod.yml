services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: bizflow-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: https://bizflowsaas.duckdns.org
      CLIENT_URL: https://bizflowsaas.duckdns.org
      FRONTEND_URL: https://bizflowsaas.duckdns.org
      API_URL: https://bizflowsaas.duckdns.org/api
      AWS_REGION: ${AWS_REGION:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - bizflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://bizflowsaas.duckdns.org/api
    container_name: bizflow-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - bizflow-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - certbot-www:/var/www/certbot:ro

networks:
  bizflow-network:
    driver: bridge

volumes:
  certbot-www:
