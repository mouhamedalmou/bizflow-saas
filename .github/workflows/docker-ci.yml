name: CI/CD - BizFlow Production Build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bizflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend type-check
        working-directory: backend
        run: npm run type-check

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        working-directory: frontend
        run: npm run type-check

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_URL: https://bizflowsaas.duckdns.org/api
        run: npm run build

  docker:
    name: Docker production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

      - name: Validate required deployment secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$MONGODB_URI" || (echo "Missing MONGODB_URI secret" && exit 1)
          test -n "$JWT_SECRET" || (echo "Missing JWT_SECRET secret" && exit 1)

      - name: Start production stack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120

      - name: Backend health check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl --fail --show-error --retry 5 --retry-delay 5 http://127.0.0.1:5000/health

      - name: Frontend health check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl --fail --show-error --retry 5 --retry-delay 5 http://127.0.0.1/health

      - name: Show container logs on failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Stop production stack
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose -f docker-compose.prod.yml down --volumes --remove-orphans
