services:
  backend:
    build: ./backend
    container_name: bizflow-backend
    ports:
      - "5000:5000"
    # env_file:
    #   - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bizflow-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped